<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <!-- Icon marks -->
  <!-- Blue slash (thick) -->
  <rect x="28" y="8" width="10" height="46" rx="5" fill="#003DA5" transform="rotate(-20 28 8)"/>
  <!-- Green slash (medium) -->
  <rect x="50" y="18" width="9" height="40" rx="4.5" fill="#5CB85C" transform="rotate(-20 50 18)"/>
  <!-- Blue dot -->
  <circle cx="44" cy="62" r="5" fill="#003DA5"/>
  <!-- Cyan slash (thin top-left) -->
  <rect x="16" y="4" width="6" height="28" rx="3" fill="#00A8E1" transform="rotate(-20 16 4)"/>
  
  <!-- SLT text - dark blue -->
  <text x="74" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#003DA5" letter-spacing="-1">SLT</text>
  <!-- MOBITEL text - green -->
  <text x="137" y="80" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#5CB85C" letter-spacing="-1">MOBITEL</text>
  <!-- Tagline -->
  <text x="74" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#003DA5" letter-spacing="3">The Connection</text>
</svg>
